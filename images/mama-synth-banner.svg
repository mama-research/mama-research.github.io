<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 600 600" width="600" height="600" role="img"
     aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">MAMA-SYNTH Banner</title>
  <desc id="bannerDesc">MAMA-SYNTH MRI Contrast Synthesis Challenge banner for MICCAI 2026</desc>

  <defs>
    <!-- Backgrounds -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#030d28"/>
      <stop offset="55%"  stop-color="#0e1540"/>
      <stop offset="100%" stop-color="#1c0636"/>
    </linearGradient>

    <!-- MAMA logo gradients -->
    <linearGradient id="outerFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#032a5c"/>
      <stop offset="42%"  stop-color="#6b35e6"/>
      <stop offset="100%" stop-color="#e6219e"/>
    </linearGradient>
    <linearGradient id="leftBreast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffd6ef"/>
      <stop offset="55%"  stop-color="#ff7bcd"/>
      <stop offset="100%" stop-color="#e034a4"/>
    </linearGradient>
    <linearGradient id="rightBreast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f05ac0"/>
      <stop offset="55%"  stop-color="#d21b93"/>
      <stop offset="100%" stop-color="#9b0067"/>
    </linearGradient>
    <radialGradient id="popHighlight" cx="35%" cy="28%" r="75%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Text gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff9de3"/>
      <stop offset="40%"  stop-color="#d966ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="lineGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6b35e6" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#e6219e"/>
      <stop offset="100%" stop-color="#6b35e6" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haloFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
    </filter>

    <!-- Dot-grid pattern -->
    <pattern id="dotGrid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="1.2" fill="#6b35e6" opacity="0.35"/>
      <circle cx="0"  cy="0"  r="0.7" fill="#e6219e" opacity="0.2"/>
      <circle cx="50" cy="0"  r="0.7" fill="#e6219e" opacity="0.2"/>
      <circle cx="0"  cy="50" r="0.7" fill="#e6219e" opacity="0.2"/>
      <circle cx="50" cy="50" r="0.7" fill="#e6219e" opacity="0.2"/>
    </pattern>

    <!-- Hex pattern -->
    <pattern id="hexPat" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,2 56,16 56,36 30,50 4,36 4,16"
               fill="none" stroke="#6b35e6" stroke-width="0.5" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- LAYER 1 — BACKGROUND -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <rect width="600" height="600" fill="url(#dotGrid)"/>
  <rect width="600" height="600" fill="url(#hexPat)"/>

  <!-- Ambient glow orbs -->
  <circle cx="300" cy="200" r="200" fill="#6b35e6" opacity="0.07" filter="url(#haloFilter)"/>
  <circle cx="480" cy="480" r="150" fill="#e6219e"  opacity="0.06" filter="url(#haloFilter)"/>
  <circle cx="80"  cy="500" r="120" fill="#6b35e6"  opacity="0.05" filter="url(#haloFilter)"/>

  <!-- LAYER 2 — WATERMARK LOGO ECHOES -->
  <g transform="translate(410, -20) scale(0.45)" opacity="0.055">
    <circle cx="128" cy="128" r="104" fill="url(#outerFill)"/>
    <path d="M70 70 L70 186 A58 58 0 0 0 70 70 Z"   fill="url(#leftBreast)"/>
    <path d="M186 70 L186 186 A58 58 0 0 1 186 70 Z" fill="url(#rightBreast)"/>
  </g>
  <g transform="translate(-30, 390) scale(0.38)" opacity="0.04">
    <circle cx="128" cy="128" r="104" fill="url(#outerFill)"/>
    <path d="M70 70 L70 186 A58 58 0 0 0 70 70 Z"   fill="url(#leftBreast)"/>
    <path d="M186 70 L186 186 A58 58 0 0 1 186 70 Z" fill="url(#rightBreast)"/>
  </g>
  <g transform="translate(450, 400) scale(0.32)" opacity="0.04">
    <circle cx="128" cy="128" r="104" fill="url(#outerFill)"/>
    <path d="M70 70 L70 186 A58 58 0 0 0 70 70 Z"   fill="url(#leftBreast)"/>
    <path d="M186 70 L186 186 A58 58 0 0 1 186 70 Z" fill="url(#rightBreast)"/>
  </g>

  <!-- LAYER 3 — DECORATIVE ELEMENTS -->
  <path d="M0 510 Q150 475 300 510 Q450 545 600 510"
        stroke="#6b35e6" stroke-width="1.2" fill="none" opacity="0.3"/>
  <path d="M0 530 Q150 495 300 530 Q450 565 600 530"
        stroke="#e6219e"  stroke-width="0.8" fill="none" opacity="0.2"/>

  <!-- Neural network upper-left -->
  <g opacity="0.5" filter="url(#softGlow)">
    <line x1="18"  y1="55"  x2="72"  y2="95"  stroke="#c678f0" stroke-width="0.9"/>
    <line x1="72"  y1="95"  x2="130" y2="60"  stroke="#6b35e6" stroke-width="0.9"/>
    <line x1="130" y1="60"  x2="190" y2="105" stroke="#e6219e"  stroke-width="0.9"/>
    <line x1="72"  y1="95"  x2="90"  y2="155" stroke="#e6219e"  stroke-width="0.9"/>
    <line x1="90"  y1="155" x2="155" y2="145" stroke="#c678f0" stroke-width="0.9"/>
    <line x1="155" y1="145" x2="205" y2="180" stroke="#6b35e6" stroke-width="0.9"/>
    <circle cx="18"  cy="55"  r="3"   fill="#c678f0"/>
    <circle cx="72"  cy="95"  r="4"   fill="#d966ff"/>
    <circle cx="130" cy="60"  r="3"   fill="#6b35e6"/>
    <circle cx="190" cy="105" r="3.5" fill="#e6219e"/>
    <circle cx="90"  cy="155" r="3"   fill="#c678f0"/>
    <circle cx="155" cy="145" r="2.5" fill="#e6219e"/>
    <circle cx="205" cy="180" r="3.5" fill="#6b35e6"/>
  </g>

  <!-- Neural network upper-right -->
  <g opacity="0.5" filter="url(#softGlow)">
    <line x1="390" y1="40"  x2="455" y2="80"  stroke="#c678f0" stroke-width="0.9"/>
    <line x1="455" y1="80"  x2="520" y2="48"  stroke="#6b35e6" stroke-width="0.9"/>
    <line x1="520" y1="48"  x2="582" y2="90"  stroke="#e6219e"  stroke-width="0.9"/>
    <line x1="455" y1="80"  x2="480" y2="145" stroke="#e6219e"  stroke-width="0.9"/>
    <line x1="480" y1="145" x2="548" y2="130" stroke="#c678f0" stroke-width="0.9"/>
    <line x1="548" y1="130" x2="590" y2="170" stroke="#6b35e6" stroke-width="0.9"/>
    <circle cx="390" cy="40"  r="3"   fill="#c678f0"/>
    <circle cx="455" cy="80"  r="4"   fill="#d966ff"/>
    <circle cx="520" cy="48"  r="3"   fill="#6b35e6"/>
    <circle cx="582" cy="90"  r="3.5" fill="#e6219e"/>
    <circle cx="480" cy="145" r="3"   fill="#c678f0"/>
    <circle cx="548" cy="130" r="2.5" fill="#e6219e"/>
    <circle cx="590" cy="170" r="3.5" fill="#6b35e6"/>
  </g>

  <!-- Sparkle stars -->
  <g filter="url(#glow)">
    <g transform="translate(30, 300)">
      <path d="M0,-8 L1.7,-1.7 L8,0 L1.7,1.7 L0,8 L-1.7,1.7 L-8,0 L-1.7,-1.7 Z" fill="#ffd6ef" opacity="0.85"/>
    </g>
    <g transform="translate(570, 310)">
      <path d="M0,-8 L1.7,-1.7 L8,0 L1.7,1.7 L0,8 L-1.7,1.7 L-8,0 L-1.7,-1.7 Z" fill="#c678f0" opacity="0.8"/>
    </g>
    <g transform="translate(22, 175)">
      <path d="M0,-6 L1.3,-1.3 L6,0 L1.3,1.3 L0,6 L-1.3,1.3 L-6,0 L-1.3,-1.3 Z" fill="#ff7bcd" opacity="0.75"/>
    </g>
    <g transform="translate(578, 175)">
      <path d="M0,-6 L1.3,-1.3 L6,0 L1.3,1.3 L0,6 L-1.3,1.3 L-6,0 L-1.3,-1.3 Z" fill="#ff7bcd" opacity="0.75"/>
    </g>
    <g transform="translate(40, 450)">
      <path d="M0,-5 L1,-1 L5,0 L1,1 L0,5 L-1,1 L-5,0 L-1,-1 Z" fill="#ffffff" opacity="0.6"/>
    </g>
    <g transform="translate(560, 450)">
      <path d="M0,-5 L1,-1 L5,0 L1,1 L0,5 L-1,1 L-5,0 L-1,-1 Z" fill="#ffffff" opacity="0.6"/>
    </g>
    <g transform="translate(300, 22)">
      <path d="M0,-7 L1.5,-1.5 L7,0 L1.5,1.5 L0,7 L-1.5,1.5 L-7,0 L-1.5,-1.5 Z" fill="#ffd6ef" opacity="0.9"/>
    </g>
    <g transform="translate(170, 35)">
      <path d="M0,-5 L1,-1 L5,0 L1,1 L0,5 L-1,1 L-5,0 L-1,-1 Z" fill="#c678f0" opacity="0.7"/>
    </g>
    <g transform="translate(430, 35)">
      <path d="M0,-5 L1,-1 L5,0 L1,1 L0,5 L-1,1 L-5,0 L-1,-1 Z" fill="#c678f0" opacity="0.7"/>
    </g>
    <g transform="translate(145, 565)">
      <path d="M0,-5 L1,-1 L5,0 L1,1 L0,5 L-1,1 L-5,0 L-1,-1 Z" fill="#e6219e" opacity="0.65"/>
    </g>
    <g transform="translate(455, 565)">
      <path d="M0,-5 L1,-1 L5,0 L1,1 L0,5 L-1,1 L-5,0 L-1,-1 Z" fill="#6b35e6" opacity="0.65"/>
    </g>
  </g>

  <!-- Tiny scattered dots -->
  <circle cx="90"  cy="28"  r="1.5" fill="#ffffff"  opacity="0.55"/>
  <circle cx="510" cy="22"  r="1.5" fill="#ffffff"  opacity="0.55"/>
  <circle cx="215" cy="18"  r="1.2" fill="#ff7bcd"  opacity="0.6"/>
  <circle cx="385" cy="18"  r="1.2" fill="#ff7bcd"  opacity="0.6"/>
  <circle cx="580" cy="55"  r="1.5" fill="#c678f0"  opacity="0.5"/>
  <circle cx="20"  cy="55"  r="1.5" fill="#c678f0"  opacity="0.5"/>
  <circle cx="592" cy="400" r="1.2" fill="#ffd6ef"  opacity="0.55"/>
  <circle cx="8"   cy="400" r="1.2" fill="#ffd6ef"  opacity="0.55"/>
  <circle cx="300" cy="590" r="1.5" fill="#ffffff"  opacity="0.5"/>

  <!-- LAYER 4 — MAIN MAMA LOGO (centered top) -->
  <circle cx="300" cy="185" r="130" fill="#6b35e6" opacity="0.11" filter="url(#haloFilter)"/>
  <circle cx="300" cy="185" r="108" fill="none" stroke="#e6219e" stroke-width="1"
          stroke-dasharray="6 5" opacity="0.22"/>
  <circle cx="300" cy="185" r="118" fill="none" stroke="#6b35e6" stroke-width="0.8"
          stroke-dasharray="3 8" opacity="0.18"/>

  <!-- scale 0.85, center at (300,185): translate(300-128*0.85, 185-128*0.85) = (191.2, 76.2) -->
  <g transform="translate(191, 76) scale(0.85)" filter="url(#bigGlow)">
    <circle cx="128" cy="128" r="104" fill="url(#outerFill)"/>
    <circle cx="128" cy="128" r="104" fill="url(#popHighlight)"/>
    <path d="M70 70 L70 186 A58 58 0 0 0 70 70 Z"   fill="url(#leftBreast)"/>
    <path d="M186 70 L186 186 A58 58 0 0 1 186 70 Z" fill="url(#rightBreast)"/>
  </g>

  <!-- LAYER 5 — TITLE & TEXT -->
  <text x="300" y="330"
        text-anchor="middle"
        font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif"
        font-size="72"
        font-weight="900"
        fill="url(#titleGrad)"
        filter="url(#bigGlow)"
        letter-spacing="-1">MAMA-SYNTH</text>

  <text x="300" y="372"
        text-anchor="middle"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="22"
        font-weight="600"
        fill="#ffc8f0"
        opacity="0.92"
        letter-spacing="2">MRI CONTRAST SYNTHESIS CHALLENGE</text>

  <rect x="60" y="392" width="480" height="1.5" fill="url(#lineGradL)" opacity="0.65" rx="1"/>

  <text x="300" y="420"
        text-anchor="middle"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="18"
        fill="#b090d8"
        letter-spacing="2">AI  ·  MEDICAL IMAGING  ·  MRI  ·  OPEN CHALLENGE</text>



</svg>
