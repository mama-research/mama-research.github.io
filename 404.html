<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page moved | MAMA-SYNTH</title>
<meta name="robots" content="noindex">
<script>
  // Visitors arriving from the old www.ub.edu/mama-synth/ site may have an
  // outdated 301 cached in their browser that keeps the /mama-synth/ path
  // segment. Browsers never re-ask the server for a cached 301, so this is
  // the only place we can catch them. Strip the stale segment and retry.
  (function () {
    var stale = '/mama-synth/';
    var path = window.location.pathname;
    if (path.indexOf(stale) === 0) {
      var fixed = '/' + path.slice(stale.length) + window.location.search + window.location.hash;
      window.location.replace(fixed);
    }
  })();
</script>
